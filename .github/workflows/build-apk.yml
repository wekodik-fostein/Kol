name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Point Godot at the preinstalled templates and SDKs
        run: |
          TPL=$(find / -type d -path "*export_templates/4.3.stable" 2>/dev/null | head -1)
          echo "Export templates found at: ${TPL:-NOT FOUND}"
          test -n "$TPL"
          echo "Template dir contents:"; ls -la "$TPL" | head -40
          for t in android_debug.apk android_release.apk; do
            if [ ! -f "$TPL/$t" ]; then
              echo "MISSING $t -> using android_debug.apk as stand-in"
              cp "$TPL/android_debug.apk" "$TPL/$t" || echo "copy failed"
            fi
          done
          mkdir -p "$HOME/.local/share/godot/export_templates"
          ln -sfn "$TPL" "$HOME/.local/share/godot/export_templates/4.3.stable"
          JDK=$(dirname "$(dirname "$(readlink -f "$(which javac)")")")
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<TRES
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JDK"
          export/android/android_sdk_path = "${ANDROID_HOME:-/usr/lib/android-sdk}"
          TRES
          cat "$HOME/.config/godot/editor_settings-4.3.tres"

      - name: Diagnose Android SDK layout
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/platform-tools" || echo "NO platform-tools"
          ls "$ANDROID_HOME/build-tools" || echo "NO build-tools"
          ls "$ANDROID_HOME/cmdline-tools" || echo "NO cmdline-tools"

      - name: Provide build-tools matching Godot's default target SDK (34)
        run: |
          if [ ! -d "$ANDROID_HOME/build-tools/34.0.0" ]; then
            (yes | sdkmanager --licenses >/dev/null 2>&1; sdkmanager "build-tools;34.0.0") \
              || ln -s "$ANDROID_HOME/build-tools/33.0.2" "$ANDROID_HOME/build-tools/34.0.0"
          fi
          ls "$ANDROID_HOME/build-tools"

      - name: Install Android platform 34 for the Gradle build
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" | tail -2
          ls "$ANDROID_HOME/platforms"

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v -keystore /tmp/debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Kol Debug, O=Kol, C=KG"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=/tmp/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Install Android build template into the project
        run: |
          TPL=$(find / -type d -path "*export_templates/4.3.stable" 2>/dev/null | head -1)
          mkdir -p android/build
          unzip -q "$TPL/android_source.zip" -d android/build
          echo "4.3.stable" > android/.build_version
          ls -la android/build | head -20

      - name: Import assets
        run: godot --headless --import

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/Kol-debug.apk
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: Kol-debug-apk
          path: build/Kol-debug.apk
