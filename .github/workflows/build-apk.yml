name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Point Godot at the preinstalled templates and SDKs
        run: |
          TPL=$(find / -type d -path "*export_templates/4.3.stable" 2>/dev/null | head -1)
          echo "Export templates found at: ${TPL:-NOT FOUND}"
          test -n "$TPL"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          ln -sfn "$TPL" "$HOME/.local/share/godot/export_templates/4.3.stable"
          JDK=$(dirname "$(dirname "$(readlink -f "$(which javac)")")")
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<TRES
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JDK"
          export/android/android_sdk_path = "${ANDROID_HOME:-/usr/lib/android-sdk}"
          TRES
          cat "$HOME/.config/godot/editor_settings-4.3.tres"

      - name: Diagnose Android SDK layout
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/platform-tools" || echo "NO platform-tools"
          ls "$ANDROID_HOME/build-tools" || echo "NO build-tools"
          ls "$ANDROID_HOME/cmdline-tools" || echo "NO cmdline-tools"

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v -keystore /tmp/debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Kol Debug, O=Kol, C=KG"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=/tmp/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Import assets
        run: godot --headless --import

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/Kol-debug.apk
          ls -la build

      - name: Sign APK with debug key
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          echo "Using $APKSIGNER"
          "$APKSIGNER" sign --ks /tmp/debug.keystore --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android build/Kol-debug.apk
          "$APKSIGNER" verify --verbose build/Kol-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Kol-debug-apk
          path: build/Kol-debug.apk
